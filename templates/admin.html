<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка · imdown.pro</title>
<style>
:root{
  --bg:#0f1115; --card:#161b22; --border:rgba(255,255,255,.1);
  --text:#e8ecf1; --muted:#8b93a1; --accent:#ff7a4a; --accent2:#ff4a8b;
  --ok:#4ade80; --warn:#fbbf24; --err:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;padding:24px;
}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;}
h1{font-size:28px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;}
.btn-out{
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:10px 20px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;
  text-decoration:none;transition:all .2s;
}
.btn-out:hover{background:rgba(239,68,68,.15);border-color:var(--err);color:var(--err);}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:24px;margin-bottom:20px;
}
.card h2{font-size:16px;font-weight:700;margin-bottom:16px;letter-spacing:-.2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
label{font-size:13px;color:var(--muted);min-width:140px}
input[type=text], input[type=password], textarea, select{
  flex:1;min-width:200px;padding:10px 14px;background:#0a0d12;
  border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-family:inherit;font-size:14px;outline:none;transition:border-color .2s;
}
input:focus, textarea:focus, select:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
button{
  padding:10px 20px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  font-family:inherit;transition:transform .15s ease, opacity .2s;
}
button:hover{transform:translateY(-1px)}
button.ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text)}
button.danger{background:var(--err)}
.switch{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  user-select:none;
}
.switch input{display:none}
.switch .track{
  width:44px;height:24px;background:rgba(255,255,255,.1);border-radius:999px;
  position:relative;transition:background .2s;
}
.switch .track::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  background:#fff;border-radius:50%;transition:left .2s;
}
.switch input:checked + .track{background:var(--ok)}
.switch input:checked + .track::after{left:23px}

/* Цвет */
.color-picker-wrap {
  display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;
}
.color-presets {
  display: flex; gap: 6px;
}
.color-preset {
  width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent;
  cursor: pointer; transition: transform 0.15s;
}
.color-preset:hover { transform: scale(1.1); }
input[type=color] {
  width: 44px; height: 38px; padding: 0; border: 1px solid var(--border);
  border-radius: 10px; background: #0a0d12; cursor: pointer;
}
input[type=color]::-webkit-color-swatch-wrapper { padding: 4px; }
input[type=color]::-webkit-color-swatch { border-radius: 6px; border: none; }

.users-table{width:100%;border-collapse:collapse;font-size:13px}
.users-table th{
  text-align:left;color:var(--muted);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:1px;padding:8px 10px;
  border-bottom:1px solid var(--border);
}
.users-table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.04)}
.users-table tr:hover td{background:rgba(255,255,255,.02)}
.users-table .name{font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.tag.admin{background:rgba(255,122,74,.15);color:var(--accent)}
.tag.user{background:rgba(255,255,255,.05);color:var(--muted)}
.toast{
  position:fixed;bottom:20px;right:20px;padding:12px 20px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  font-size:14px;opacity:0;transform:translateY(20px);
  transition:all .3s ease;pointer-events:none;z-index:100;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:var(--ok);color:var(--ok)}
.toast.err{border-color:var(--err);color:var(--err)}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  z-index:200;display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal h3{font-size:18px;margin-bottom:16px;color:#fff}
</style></head><body>

<div class="wrap">
  <div class="top">
    <div>
      <h1>⚙ Админка</h1>
      <div class="sub">Управление imdown.pro · вы вошли как <b>__ADMIN__</b></div>
    </div>
    <a href="/logout" class="btn-out">Выйти</a>
  </div>

  <div class="card">
    <h2>🔒 Режим техобслуживания</h2>
    <div class="row">
      <label class="switch">
        <input type="checkbox" id="site_closed">
        <span class="track"></span>
        Сайт закрыт для всех
      </label>
    </div>
    <div class="row">
      <label>Текст заглушки</label>
      <textarea id="site_closed_message"></textarea>
    </div>
    <button onclick="saveSettings()">Сохранить</button>
  </div>

  <div class="card">
    <h2>🎨 Глобальная тема</h2>
    <div class="row">
      <label>Тема для всех</label>
      <select id="global_theme">
        <option value="">По умолчанию (Sunset)</option>
        <option value="sunset">Sunset</option>
        <option value="midnight">Midnight</option>
        <option value="winter">Winter</option>
      </select>
    </div>
    <button onclick="saveSettings()">Сохранить</button>
  </div>

  <div class="card">
    <h2>📢 Баннер на главной</h2>
    <div class="row">
      <label class="switch">
        <input type="checkbox" id="banner_enabled">
        <span class="track"></span>
        Показывать баннер
      </label>
    </div>
    <div class="row">
      <label>Текст баннера</label>
      <input type="text" id="banner_text" placeholder="Обновление уже вышло!">
    </div>
    <div class="row">
      <label>Ссылка (куда ведёт)</label>
      <input type="text" id="banner_link" placeholder="/updates">
    </div>
    <div class="row">
      <label>Цвет</label>
      <div class="color-picker-wrap">
        <input type="color" id="banner_bg" value="#ff7a4a">
        <div class="color-presets">
          <div class="color-preset" style="background:#ff7a4a" onclick="document.getElementById('banner_bg').value='#ff7a4a'" title="Sunset"></div>
          <div class="color-preset" style="background:#00ADB5" onclick="document.getElementById('banner_bg').value='#00ADB5'" title="Midnight"></div>
          <div class="color-preset" style="background:#7cc4ff" onclick="document.getElementById('banner_bg').value='#7cc4ff'" title="Winter"></div>
          <div class="color-preset" style="background:#e52e2e" onclick="document.getElementById('banner_bg').value='#e52e2e'" title="RED"></div>
        </div>
      </div>
    </div>
    <button onclick="saveSettings()">Сохранить</button>
  </div>

  <div class="card">
    <h2>👥 Пользователи</h2>
    <div style="overflow-x:auto">
      <table class="users-table" id="usersTable">
        <thead>
          <tr>
            <th>Ник</th>
            <th>Email</th>
            <th>Счёт</th>
            <th>Роль</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="passModal">
  <div class="modal">
    <h3>Смена пароля</h3>
    <div style="margin-bottom:12px;font-size:13px;color:var(--muted)">
      Пользователь: <b id="passUser" style="color:#fff"></b>
    </div>
    <input type="password" id="newPass" placeholder="Новый пароль" style="width:100%;margin-bottom:16px">
    <div style="display:flex;gap:10px">
      <button onclick="savePassword()" style="flex:1">Сменить</button>
      <button class="ghost" onclick="document.getElementById('passModal').classList.remove('open')" style="flex:1">Отмена</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let settings = {};
let currentPassUser = '';

async function loadSettings(){
  const r = await fetch('/api/admin/settings');
  const d = await r.json();
  if (!d.ok){ document.body.innerHTML = '<h2 style="color:#ef4444;padding:40px">Нет доступа.</h2>'; return; }
  settings = d.settings;
  document.getElementById('site_closed').checked = !!settings.site_closed;
  document.getElementById('site_closed_message').value = settings.site_closed_message || '';
  document.getElementById('global_theme').value = settings.global_theme || '';
  document.getElementById('banner_enabled').checked = !!settings.banner_enabled;
  document.getElementById('banner_text').value = settings.banner_text || '';
  document.getElementById('banner_link').value = settings.banner_link || '';
  document.getElementById('banner_bg').value = settings.banner_bg || '#ff7a4a';
}

async function saveSettings(){
  const body = {
    site_closed: document.getElementById('site_closed').checked,
    site_closed_message: document.getElementById('site_closed_message').value,
    global_theme: document.getElementById('global_theme').value,
    banner_enabled: document.getElementById('banner_enabled').checked,
    banner_text: document.getElementById('banner_text').value,
    banner_link: document.getElementById('banner_link').value,
    banner_bg: document.getElementById('banner_bg').value,
  };
  const r = await fetch('/api/admin/settings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.ok) toast('Сохранено', 'ok');
  else toast('Ошибка', 'err');
}

async function loadUsers(){
  const r = await fetch('/api/admin/users');
  const d = await r.json();
  if (!d.ok) return;
  const tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = '';
  d.users.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="name">${escapeHtml(u.name)}</td>
      <td>${escapeHtml(u.email || '—')}</td>
      <td>${formatNum(u.score)}</td>
      <td><span class="tag ${u.is_admin?'admin':'user'}">${u.is_admin?'admin':'user'}</span></td>
      <td style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="ghost" style="padding:6px 12px;font-size:12px" onclick="openPassModal('${escapeHtml(u.name)}')">Пароль</button>
        <button class="ghost" style="padding:6px 12px;font-size:12px" onclick="toggleAdmin('${escapeHtml(u.name)}')">${u.is_admin ? 'Снять админа' : 'В админы'}</button>
        ${u.name !== '__ADMIN__' ? `<button class="danger" style="padding:6px 12px;font-size:12px" onclick="deleteUser('${escapeHtml(u.name)}')">Удалить</button>` : ''}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatNum(n){
  if (n >= 1e12) return (n/1e12).toFixed(2)+'T';
  if (n >= 1e9)  return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6)  return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3)  return (n/1e3).toFixed(2)+'K';
  return String(Math.floor(n));
}

async function toggleAdmin(name){
  const r = await fetch('/api/admin/user/toggle_admin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  });
  const d = await r.json();
  if (d.ok){ toast(name + ' → ' + (d.is_admin?'admin':'user'), 'ok'); loadUsers(); }
  else toast('Ошибка', 'err');
}

async function deleteUser(name){
  if (!confirm('Удалить аккаунт ' + name + ' навсегда?')) return;
  const r = await fetch('/api/admin/user/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  });
  const d = await r.json();
  if (d.ok){ toast('Удалён', 'ok'); loadUsers(); }
  else toast('Ошибка', 'err');
}

function openPassModal(name){
  currentPassUser = name;
  document.getElementById('passUser').textContent = name;
  document.getElementById('newPass').value = '';
  document.getElementById('passModal').classList.add('open');
}

async function savePassword(){
  const pass = document.getElementById('newPass').value;
  if (pass.length < 4) return toast('Пароль слишком короткий', 'err');
  const r = await fetch('/api/admin/user/password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: currentPassUser, password: pass})
  });
  const d = await r.json();
  if (d.ok){ toast('Пароль изменён', 'ok'); document.getElementById('passModal').classList.remove('open'); }
  else toast('Ошибка', 'err');
}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2200);
}

loadSettings();
loadUsers();
</script>
</body></html>
