<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DownGames</title>
<style>
:root{
  --bg:#0f1115;--bg1:#151a22;--card:#171b22;
  --accent:#00ADB5;--accent2:#00e0ea;
  --text:#e8ecf1;--muted:#8b93a1;
  --ok:#3ddc97;--gold:#ffd166;--bad:#ff5c5c;
  --line:#222731;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);min-height:100vh;padding:28px 18px 60px;
  display:flex;justify-content:center;align-items:flex-start;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
.wrap{width:100%;max-width:760px}

.top-bar{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:36px;font-size:13px;color:var(--muted)}
.user b{color:var(--text);font-weight:500}
.logout{color:var(--muted);text-decoration:none}
.logout:hover{color:var(--bad)}

.header{margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;
  font-size:24px;font-weight:600;letter-spacing:-.2px;
  margin-bottom:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.beta{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1.2px;
  color:var(--muted);background:transparent;
  padding:2px 6px;border-radius:4px;text-transform:uppercase;
  border:1px solid var(--line)}
.subtitle{color:var(--muted);font-size:13px}

.update-note{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  margin-bottom:20px;
  border-radius:999px;
  background:rgba(0,173,181,.08);
  border:1px solid rgba(0,173,181,.25);
  color:rgba(232,236,241,.85);
  font-size:13px;
  font-weight:500;
}
.update-note .un-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent2);
  animation:unPulse 1.4s ease-in-out infinite;
}
@keyframes unPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(1.3)}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.tile{
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;padding:18px;
  min-height:150px;text-decoration:none;color:var(--text);
  transition:border-color .15s ease,background .15s ease;
}
.tile:hover{border-color:#2e3540;background:#1a1f27}
.tile-icon{font-size:24px;line-height:1;margin-bottom:14px;opacity:.9}
.tile-title{font-size:14px;font-weight:600;margin-bottom:4px;letter-spacing:-.1px}
.tile-desc{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:14px}
.tile-footer{display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--muted)}
.badge{font-weight:600;font-size:11px;letter-spacing:.2px}
.badge-ready{color:var(--ok)}
.badge-soon{color:var(--muted);opacity:.7}
.arrow{color:var(--accent2);font-size:12px;opacity:.8}
.tile.disabled{cursor:not-allowed;opacity:.5}
.tile.disabled:hover{border-color:var(--line);background:var(--card)}

@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .tile{min-height:120px;padding:16px}
  .logo{font-size:20px}
}
</style></head><body>
<div class="wrap">
  <div class="top-bar">
    <div class="user">Игрок: <b>__NAME__</b></div>
    <div style="display:flex;gap:18px;align-items:center">
      <a class="logout" href="/">На главную</a>
      <a class="logout" href="/logout">Выйти</a>
    </div>
  </div>
  <div class="header">
    <div class="logo"><div class="dot"></div>DownGames <span class="beta">beta</span></div>
    <div class="subtitle">Выбери, во что хочешь сыграть</div>
  </div>

  <div class="update-note">
    <span class="un-dot"></span>
    Скоро обновление Clicker Down
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const NAME = "__NAME__";

const PROJECTS = [
  { id: "clicker", icon: "⚡", title: "Clicker Down",
    desc: "Кликер с магазином улучшений и коллекцией вилл, машин и яхт.",
    status: "ready", url: "/game" },
  { id: "p2", icon: "🎯", title: "Проект #2", desc: "coming soon.", status: "soon" },
  { id: "p3", icon: "🧩", title: "Проект #3", desc: "coming soon.", status: "soon" },
  { id: "p4", icon: "🚀", title: "Проект #4", desc: "coming soon.", status: "soon" },
  { id: "p5", icon: "🎮", title: "Проект #5", desc: "coming soon.", status: "soon" },
  { id: "p6", icon: "🕹️", title: "Проект #6", desc: "coming soon.", status: "soon" }
];

const STATUS = {
  ready: { label: "Доступно", cls: "badge-ready" },
  soon:  { label: "Скоро",    cls: "badge-soon"  }
};

const grid = document.getElementById('grid');
PROJECTS.forEach(function(p){
  const s = STATUS[p.status] || STATUS.soon;
  const el = document.createElement(p.status === 'ready' ? 'a' : 'div');
  el.className = 'tile' + (p.status === 'ready' ? '' : ' disabled');
  if (p.status === 'ready') el.href = p.url;
  el.innerHTML =
    '<div>' +
      '<div class="tile-icon">' + p.icon + '</div>' +
      '<div class="tile-title">' + p.title + '</div>' +
      '<div class="tile-desc">' + p.desc + '</div>' +
    '</div>' +
    '<div class="tile-footer">' +
      '<span class="badge ' + s.cls + '">' + s.label + '</span>' +
      (p.status === 'ready' ? '<span class="arrow">Играть →</span>' : '') +
    '</div>';
  grid.appendChild(el);
});
</script>
</body></html>
