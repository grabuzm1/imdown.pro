<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DownGames</title>
<style>
:root{
  --text:#f4f7fc;
  --muted:#8a93a6;
  --accent:#5ff0ff;
  --accent2:#8ab0ff;
  --purple:#b57bff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#000;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(600px 400px at 20% 20%, rgba(95,240,255,.10), transparent 60%),
    radial-gradient(600px 400px at 80% 80%, rgba(181,123,255,.10), transparent 60%);
  pointer-events:none;
}
.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:420px;
  background:rgba(15,18,25,.6);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:40px 28px;
  text-align:center;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp .6s ease-out forwards;
}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

.update-note{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  margin-bottom:20px;
  border-radius:999px;
  background:rgba(95,240,255,.08);
  border:1px solid rgba(95,240,255,.25);
  color:rgba(255,255,255,.85);
  font-size:13px;
  font-weight:500;
}
.update-note .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#5ff0ff;
  box-shadow:0 0 10px #5ff0ff;
  animation:pulseDot 1.4s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(1.3)}
}

.icon{
  font-size:48px;
  margin-bottom:16px;
}
.card h1{
  font-size:26px;
  font-weight:800;
  letter-spacing:-.5px;
  margin-bottom:6px;
  background:linear-gradient(180deg, #fff, #b8d4ff 60%, #b57bff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.card p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
  line-height:1.5;
}
.btn{
  display:block;
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
  transition:transform .15s ease, box-shadow .2s ease;
  margin-bottom:10px;
}
.btn-primary{
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  color:#000;
  box-shadow:0 10px 30px rgba(95,240,255,.35);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(95,240,255,.5);
}
.back{
  position:absolute;
  top:20px;
  left:20px;
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
}
.back:hover{color:var(--text)}
</style></head><body>
<a class="back" href="/">← imdown.pro</a>
<div class="card">
  <div class="update-note">
    <span class="dot"></span>
    Скоро обновление Clicker Down
  </div>
  <div class="icon">🎮</div>
  <h1>DownGames</h1>
  <p>Игровая платформа imdown.pro. Войди через Down ID, чтобы продолжить.</p>
  <a class="btn btn-primary" href="/login?next=/games">Войти через Down ID</a>
</div>
</body></html>
