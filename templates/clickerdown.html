<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Clicker Down · imdown.pro</title>
<style>
body.theme-sunset{
  --bg:#1a1014;
  --bg-glow:radial-gradient(ellipse 1200px 800px at 50% -10%,
    rgba(255,120,80,.14) 0%,
    rgba(200,80,140,.06) 40%,
    transparent 70%);
  --text:#fdf2ee;
  --muted:#a89292;
  --accent:#ff7a4a;
  --accent2:#ff4a8b;
  --gold:#ffd166;
  --ok:#4ade80;
  --card-bg:rgba(255,255,255,.035);
  --card-border:rgba(255,150,120,.10);
  --score-grad:linear-gradient(180deg,#fff 0%, #ffb07a 55%, #ff4a8b 100%);
  --ripple:rgba(255,122,74,.35);
}
body.theme-midnight{
  --bg:#0f1115;
  --bg-glow:radial-gradient(ellipse 1200px 800px at 50% -10%,
    rgba(0,173,181,.14) 0%,
    rgba(0,224,234,.06) 40%,
    transparent 70%);
  --text:#e8ecf1;
  --muted:#8b93a1;
  --accent:#00ADB5;
  --accent2:#00e0ea;
  --gold:#ffd166;
  --ok:#4ade80;
  --card-bg:rgba(255,255,255,.035);
  --card-border:rgba(255,255,255,.08);
  --score-grad:linear-gradient(180deg,#ffffff 0%, #9fe9ee 100%);
  --ripple:rgba(0,224,234,.35);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  background:var(--bg);
  background-image:var(--bg-glow);
  background-attachment:fixed;
  min-height:100vh;
  padding:24px 20px 60px;
  overflow-x:hidden;
  touch-action:pan-y;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
  transition:background .4s ease, color .3s ease;
}
.wrap{max-width:440px;margin:0 auto}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;font-size:14px;color:var(--muted);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:15px;color:var(--text);text-decoration:none;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent2);
  animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 10px var(--accent2)}
  50%{opacity:.6;transform:scale(1.25);box-shadow:0 0 18px var(--accent2)}
}
.nav{display:flex;gap:8px;align-items:center}
.nav a, .nav button{
  color:var(--muted);text-decoration:none;font-size:13px;
  background:none;border:none;font-family:inherit;cursor:pointer;
  padding:0;transition:color .2s;white-space:nowrap;
}
.nav a:hover, .nav button:hover{color:var(--text)}

/* Кнопка с рамкой — для "DownGames" */
.nav .btn-frame{
  color:var(--accent);
  border:1px solid var(--card-border);
  padding:6px 12px;border-radius:8px;
  font-size:12px;font-weight:700;letter-spacing:.2px;
  transition:all .15s ease;
}
.nav .btn-frame:hover{background:var(--card-bg);border-color:var(--accent);color:var(--accent)}

.clicker-zone{
  position:relative;
  border-radius:22px;
  padding:44px 20px 36px;
  margin-bottom:16px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--card-border);
  overflow:hidden;
  cursor:pointer;
  text-align:center;
  transition:transform .08s ease, border-color .2s ease;
}
.clicker-zone::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 100%, var(--ripple) 0%, transparent 60%);
  opacity:.4;
  pointer-events:none;
}
.clicker-zone:active{
  transform:scale(.99);
  border-color:var(--accent);
}
.score-value{
  position:relative;
  font-size:clamp(44px, 9vw, 56px);
  font-weight:900;letter-spacing:-2.5px;line-height:1;
  margin-bottom:14px;
  background:var(--score-grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  z-index:1;word-break:break-all;
}
.score-unit{font-size:22px;font-weight:700;opacity:.8;margin-left:3px}
.score-meta{
  position:relative;z-index:1;
  display:flex;justify-content:center;gap:14px;
  font-size:13px;color:var(--muted);flex-wrap:wrap;
}
.score-meta b{color:var(--text);font-weight:700}
.score-meta .gold{color:var(--gold)}

.ripple{
  position:fixed;
  width:20px;height:20px;
  border-radius:50%;
  border:2px solid var(--accent);
  pointer-events:none;
  z-index:98;
  transform:translate(-50%,-50%);
  animation:rippleGo .55s ease-out forwards;
}
@keyframes rippleGo{
  0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(6)}
}

.level{
  padding:14px 16px;border-radius:12px;
  background:var(--card-bg);border:1px solid var(--card-border);
  margin-bottom:12px;
}
.level-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.level-head b{color:var(--text);font-weight:700}
.level-bar{height:3px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden}
.level-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius:999px;transition:width .25s ease;
}

.daily{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:12px;
  background:var(--card-bg);border:1px solid var(--card-border);
  margin-bottom:20px;
}
.daily .ico{font-size:17px;opacity:.9}
.daily .txt{flex:1;min-width:0;font-size:11px;color:var(--muted);line-height:1.3}
.daily .txt b{color:var(--text);display:block;font-size:13px;font-weight:700;margin-bottom:1px}
.daily .btn{
  background:transparent;color:var(--accent);
  border:1px solid var(--card-border);
  padding:6px 12px;border-radius:8px;
  font-size:11px;font-weight:700;
  cursor:pointer;white-space:nowrap;font-family:inherit;
  transition:all .15s ease;letter-spacing:.2px;
}
.daily .btn:hover:not(:disabled){background:var(--card-bg);border-color:var(--accent)}
.daily .btn:disabled{border-color:var(--card-border);color:var(--muted);cursor:not-allowed}

.tabs{
  display:flex;gap:0;margin-bottom:20px;
  border-bottom:1px solid var(--card-border);
}
.tab{
  flex:1;padding:12px 0;text-align:center;
  font-size:13px;font-weight:600;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .2s ease;letter-spacing:.2px;
}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

.shead{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.shead h3{
  font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--muted);
}
.modes{
  display:flex;gap:2px;
  background:var(--card-bg);
  padding:3px;border-radius:8px;
  border:1px solid var(--card-border);
}
.mode{
  padding:4px 12px;font-size:11px;font-weight:700;
  color:var(--muted);cursor:pointer;border-radius:6px;
  transition:all .15s ease;
}
.mode:hover{color:var(--text)}
.mode.active{color:var(--bg);background:var(--accent)}

.list{display:flex;flex-direction:column}
.item{
  display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;
  padding:14px 0;border-bottom:1px solid var(--card-border);
  transition:background .15s ease;
}
.item:last-child{border-bottom:none}
.item.locked{opacity:.4}
.item.owned .title::after{content:" ✓";color:var(--gold);font-size:11px}

.item.clickable{
  cursor:pointer;
  border-radius:10px;
  padding-left:8px;padding-right:8px;margin:0 -8px;
}
.item.clickable:hover{background:var(--card-bg)}
.item.clickable:active{background:rgba(255,255,255,.06)}

.icon{
  width:44px;height:44px;border-radius:11px;
  display:grid;place-items:center;font-size:19px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--card-border);
}
.title{font-size:14px;font-weight:700;margin-bottom:2px}
.sub{font-size:12px;color:var(--muted)}
.sub b{color:var(--ok);font-weight:600}

.buy{
  background:transparent;color:var(--accent);
  border:1px solid var(--card-border);
  padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:700;cursor:pointer;
  min-width:80px;text-align:center;line-height:1.25;
  font-family:inherit;transition:all .15s ease;letter-spacing:.2px;
}
.buy:hover:not(:disabled){background:var(--card-bg);border-color:var(--accent)}
.buy:disabled{border-color:var(--card-border);color:var(--muted);cursor:not-allowed}
.buy.owned-btn{border-color:var(--card-border);color:var(--gold);cursor:default}

.rebirth-card{
  padding:24px 20px;
  border-radius:16px;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  text-align:center;
  margin-bottom:16px;
}
.rebirth-icon{font-size:42px;margin-bottom:10px}
.rebirth-title{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
.rebirth-sub{font-size:13px;color:var(--muted);margin-bottom:20px}

.rebirth-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:20px;
}
.rebirth-stat{
  padding:12px 10px;border-radius:10px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--card-border);
}
.rebirth-stat .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.rebirth-stat .value{font-size:18px;font-weight:800;letter-spacing:-.3px}
.rebirth-stat .value.gold{color:var(--gold)}

.rebirth-progress{
  text-align:left;
  font-size:12px;color:var(--muted);
  margin-bottom:8px;
  display:flex;justify-content:space-between;
}
.rebirth-bar{
  height:6px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;
  margin-bottom:18px;
}
.rebirth-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius:999px;transition:width .3s ease;
}

.rebirth-btn{
  width:100%;
  padding:14px 20px;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  color:var(--bg);
  letter-spacing:.3px;
  transition:all .2s ease;
}
.rebirth-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px var(--ripple)}
.rebirth-btn:disabled{
  background:rgba(255,255,255,.05);
  color:var(--muted);
  cursor:not-allowed;
}
.rebirth-hint{
  margin-top:12px;
  font-size:11px;
  color:var(--muted);
  opacity:.75;
  line-height:1.5;
}

.floater{
  position:fixed;pointer-events:none;
  font-weight:800;font-size:15px;color:var(--accent2);
  text-shadow:0 0 12px var(--ripple);
  animation:float 1s ease-out forwards;z-index:99;
}
@keyframes float{to{transform:translateY(-60px);opacity:0}}

.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:200;display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.open{display:flex}
.modal{
  width:100%;max-width:340px;
  background:var(--bg);border:1px solid var(--card-border);
  border-radius:14px;padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.modal h3{font-size:15px;font-weight:700;margin-bottom:4px}
.modal .hint{font-size:12px;color:var(--muted);margin-bottom:16px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.theme-chip{
  display:flex;align-items:center;gap:8px;
  padding:12px;border-radius:10px;
  background:var(--card-bg);
  border:2px solid transparent;color:var(--text);
  font-size:12px;font-weight:600;cursor:pointer;
  transition:all .2s ease;font-family:inherit;
}
.theme-chip:hover{background:rgba(255,255,255,.08)}
.theme-chip.active{border-color:var(--accent)}
.swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;pointer-events:none}
.swatch.sunset{background:linear-gradient(135deg,#ff7a4a,#ff4a8b)}
.swatch.midnight{background:linear-gradient(135deg,#00ADB5,#00e0ea)}
.close-x{
  width:100%;padding:11px;border-radius:9px;
  background:var(--card-bg);
  border:1px solid var(--card-border);color:var(--text);
  font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;
}
.close-x:hover{background:rgba(255,255,255,.08)}

.offline-toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--bg);border:1px solid var(--accent);
  border-radius:12px;padding:12px 20px;font-size:13px;
  color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.6);
  z-index:99999;text-align:center;pointer-events:none;
  animation:slideUp .35s ease-out;
}
.offline-toast b{color:var(--accent2);font-weight:700}
@keyframes slideUp{
  from{transform:translate(-50%,20px);opacity:0}
  to{transform:translate(-50%,0);opacity:1}
}

@media (max-width:420px){
  body{padding:20px 16px 60px}
  .score-value{font-size:44px;letter-spacing:-2px}
  .clicker-zone{padding:36px 16px 30px}
  .item{grid-template-columns:40px 1fr auto;gap:12px}
  .icon{width:40px;height:40px;font-size:17px}
  .nav{gap:6px}
  .nav .btn-frame{padding:5px 10px;font-size:11px}
}
</style></head><body class="theme-sunset">

<div class="wrap">

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="gen">Улучшения</div>

</div>

</div>

<script>
const SHOP       = /*__SHOP__*/;
const COLLECTION = /*__COLLECTION__*/;
const THEMES     = /*__THEMES__*/;
const STATE      = /*__STATE__*/;

let score = STATE.score, power = STATE.power, cps = STATE.cps;
let lvl = STATE.lvl, next = STATE.next;
let totalEarned = STATE.total_earned || STATE.score;
let totalEarnedAll = STATE.total_earned_all || 0;
let counts = Object.assign({}, STATE.counts);
let ownedMap = Object.assign({}, STATE.owned);
let clickMult = STATE.clickMult || 0;
let cpsMult = STATE.cpsMult || 0;
let themeId = STATE.theme || 'sunset';
let buyMode = 1, tab = 'gen';
let daily = STATE.daily || { can: false, seconds_left: 0, streak: 0, bonus: 0 };
let rebirths = STATE.rebirths || 0;
let rebirthBonus = STATE.rebirthBonus || 0;
let rebirthThreshold = STATE.rebirthThreshold || 1e15;

const MAX_BUY = 10000000;
const $ = id => document.getElementById(id);

const fmt = n => {
  if (!isFinite(n)) n = 0;
  n = Math.floor(n);
  const u = [[1e33,'Dc'],[1e30,'No'],[1e27,'Oc'],[1e24,'Sp'],[1e21,'Sx'],
             [1e18,'Qi'],[1e15,'Q'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for (let i=0;i<u.length;i++) if (n >= u[i][0]) return (n/u[i][0]).toFixed(2)+u[i][1];
  return String(n);
};
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h>0) return h+'ч '+m+'м';
  if (m>0) return m+'м '+s+'с';
  return s+'с';
}
function priceAfter(base, mult, ownedQty, qty){
  if (qty<=0) return 0;
  const p0 = base*Math.pow(mult, ownedQty);
  if (Math.abs(mult-1)<1e-9) return Math.floor(p0)*qty;
  return Math.floor(p0*(Math.pow(mult,qty)-1)/(mult-1));
}
function maxAffordable(base, mult, ownedQty){
  const p0 = base*Math.pow(mult, ownedQty);
  if (score < Math.floor(p0)) return {qty:0,total:0};
  let qty;
  if (Math.abs(mult-1)<1e-9) qty = Math.floor(score/p0);
  else {
    const r = 1 + (score*(mult-1))/p0;
    if (r<=0) return {qty:0,total:0};
    qty = Math.floor(Math.log(r)/Math.log(mult));
  }
  if (qty<0) qty=0;
  if (qty>MAX_BUY) qty=MAX_BUY;
  while (qty>0 && priceAfter(base,mult,ownedQty,qty)>score) qty--;
  while (qty<MAX_BUY && priceAfter(base,mult,ownedQty,qty+1)<=score) qty++;
  return {qty:qty, total: priceAfter(base,mult,ownedQty,qty)};
}

function applyTheme(id){
  document.body.className = 'theme-' + id;
}
function checkLevelUp(){
  while (totalEarned >= next){
    lvl++;
    power += 1;
    next = Math.floor(next * 1.5);
  }
}
function renderStats(){
  $('s').textContent = fmt(score);
  $('c').textContent = cps.toFixed(1);
  $('m').textContent = '+' + Math.round(clickMult*100) + '% / +' + Math.round(cpsMult*100) + '%';
  $('l').textContent = lvl;
  $('ltxt').textContent = fmt(totalEarned) + ' / ' + fmt(next);
  const pct = Math.max(0, Math.min(100, (totalEarned / next) * 100));
  $('bar').style.width = pct + '%';
  if (rebirths > 0){
    $('rb-badge').style.display = 'inline';
    $('rb-count').textContent = rebirths;
  } else {
    $('rb-badge').style.display = 'none';
  }
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  $('list-title').textContent = tab === 'gen' ? 'Улучшения' : (tab === 'col' ? 'Коллекция' : 'Перерождение');
  $('modes').style.display = tab === 'gen' ? 'flex' : 'none';
  $('shop-shead').style.display = tab === 'reb' ? 'none' : 'flex';
  $('list').style.display = tab === 'reb' ? 'none' : 'flex';
  $('rebirth-panel').style.display = tab === 'reb' ? 'block' : 'none';
  if (tab === 'reb') renderRebirth();
}
function renderGen(){
  const box = $('list');
  let html = '';
  SHOP.forEach(item => {
    const qty = counts[item.id] || 0;
    const price = priceAfter(item.base, item.mult, qty, 1);
    const can = score >= price;
    const cls = 'item' + (qty === 0 && !can ? ' locked' : '') + (can ? ' clickable' : '');
    html +=
      '<div class="' + cls + '" ' +
        (can ? 'onclick="buyClick(\'' + item.id + '\',\'gen\',event)"' : '') + '>' +
        '<div class="icon">' + item.icon + '</div>' +
        '<div><div class="title">' + item.name + '</div>' +
        '<div class="sub">' + item.desc + ' · <b>' + qty + '</b></div></div>' +
        '<button type="button" class="buy" data-id="' + item.id + '"' +
          (can ? '' : ' disabled') +
          ' onclick="buyClick(\'' + item.id + '\',\'gen\',event)">' +
          fmt(price) + ' ⚡' +
        '</button>' +
      '</div>';
  });
  box.innerHTML = html;
}
function renderCol(){
  const box = $('list');
  let html = '';
  COLLECTION.forEach(item => {
    const isOwned = !!ownedMap[item.id];
    const can = score >= item.base && !isOwned;
    const cls = 'item' + (isOwned ? ' owned' : '') +
                (!isOwned && !can ? ' locked' : '') +
                (can ? ' clickable' : '');
    let btn;
    if (isOwned){
      btn = '<button type="button" class="buy owned-btn" disabled>✓</button>';
    } else {
      btn = '<button type="button" class="buy" data-id="' + item.id + '"' +
              (can ? '' : ' disabled') +
              ' onclick="buyClick(\'' + item.id + '\',\'col\',event)">' +
              fmt(item.base) + ' ⚡' +
            '</button>';
    }
    html +=
      '<div class="' + cls + '" ' +
        (can ? 'onclick="buyClick(\'' + item.id + '\',\'col\',event)"' : '') + '>' +
        '<div class="icon">' + item.icon + '</div>' +
        '<div><div class="title">' + item.name + '</div>' +
        '<div class="sub">' + item.desc + '</div></div>' +
        btn +
      '</div>';
  });
  box.innerHTML = html;
}
function renderList(){
  if (tab === 'gen') renderGen();
  else if (tab === 'col') renderCol();
}
function renderRebirth(){
  const box = $('rebirth-panel');
  const canReb = totalEarned >= rebirthThreshold;
  const pct = Math.max(0, Math.min(100, (totalEarned / rebirthThreshold) * 100));
  const nextBonus = (rebirths + 1) * (rebirths + 1);
  box.innerHTML =
    '<div class="rebirth-card">' +
      '<div class="rebirth-icon">💎</div>' +
      '<div class="rebirth-title">Перерождение</div>' +
      '<div class="rebirth-sub">Сбрось прогресс и стань сильнее</div>' +

      '<div class="rebirth-stats">' +
        '<div class="rebirth-stat">' +
          '<div class="label">Перерождений</div>' +
          '<div class="value gold">' + rebirths + '</div>' +
        '</div>' +
        '<div class="rebirth-stat">' +
          '<div class="label">Бонус к клику</div>' +
          '<div class="value">+' + Math.round(rebirthBonus * 100) + '%</div>' +
        '</div>' +
      '</div>' +

      '<div class="rebirth-progress">' +
        '<span>Прогресс</span>' +
        '<span>' + fmt(totalEarned) + ' / ' + fmt(rebirthThreshold) + '</span>' +
      '</div>' +
      '<div class="rebirth-bar"><div class="rebirth-fill" style="width:' + pct + '%"></div></div>' +

      '<button class="rebirth-btn" id="rebirth-btn"' + (canReb ? '' : ' disabled') + '>' +
        (canReb ? 'Переродиться → +' + Math.round(nextBonus * 100) + '%' : 'Недостаточно прогресса') +
      '</button>' +

      '<div class="rebirth-hint">' +
        'Сбрасывает: очки, юниты, коллекцию, уровень, ежедневку.<br>' +
        'Оставляет: перерождения, тему, историю.' +
      '</div>' +
    '</div>';

  const btn = $('rebirth-btn');
  if (btn && canReb){
    btn.addEventListener('click', doRebirth);
  }
}

window.buyClick = function(id, kind, ev){
  if (ev){ ev.preventDefault(); ev.stopPropagation(); }
  if (kind === 'col') buyCol(id);
  else buyGen(id);
};

function buyGen(id){
  const item = SHOP.find(i => i.id === id); if (!item) return;
  const qtyOwned = counts[id] || 0;
  let qty, total;
  if (buyMode === 'max'){
    const r = maxAffordable(item.base, item.mult, qtyOwned);
    qty = r.qty; total = r.total;
  } else {
    qty = buyMode;
    total = priceAfter(item.base, item.mult, qtyOwned, qty);
  }
  if (qty === 0 || total > score) return;
  score -= total;
  counts[id] = qtyOwned + qty;
  cps += item.cps * qty * (1 + cpsMult);
  renderStats(); renderList(); save();
}
function buyCol(id){
  const item = COLLECTION.find(i => i.id === id);
  if (!item || ownedMap[id] || score < item.base) return;
  score -= item.base;
  ownedMap[id] = 1;
  clickMult += item.bonus;
  cpsMult += item.cps_bonus || 0;
  cps *= (1 + (item.cps_bonus || 0));
  renderStats(); renderList(); save();
}

function clickValue(){
  return Math.max(1, Math.floor(power * (1 + clickMult) * (1 + rebirthBonus)));
}

const clickerBtn = $('btn');

function handleTap(x, y){
  const gain = clickValue();
  score += gain;
  totalEarned += gain;
  checkLevelUp();
  spawnRipple(x, y);
  spawnFloat('+' + fmt(gain), x, y - 40);
  renderStats();
}

clickerBtn.addEventListener('pointerdown', function(e){
  e.preventDefault();
  handleTap(e.clientX, e.clientY);
}, {passive:false});
clickerBtn.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
clickerBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); });

function spawnRipple(x, y){
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = x + 'px';
  r.style.top = y + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 600);
}
function spawnFloat(text, x, y){
  const f = document.createElement('div');
  f.className = 'floater'; f.textContent = text;
  f.style.left = x + 'px'; f.style.top = y + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 800);
}

$('tabs').addEventListener('click', function(e){
  const t = e.target.closest('.tab'); if (!t) return;
  if (t.dataset.tab === tab) return;
  tab = t.dataset.tab; renderTabs(); renderList();
});

$('modes').addEventListener('click', function(e){
  const m = e.target.closest('.mode'); if (!m) return;
  document.querySelectorAll('.mode').forEach(x => x.classList.remove('active'));
  m.classList.add('active');
  buyMode = (m.dataset.m === 'max') ? 'max' : parseInt(m.dataset.m);
});

function openSettings(){
  const box = $('themes'); box.innerHTML = '';
  THEMES.forEach(t => {
    const el = document.createElement('div');
    el.className = 'theme-chip' + (t.id === themeId ? ' active' : '');
    el.innerHTML = '<div class="swatch ' + t.id + '"></div>' + t.name;
    el.addEventListener('click', function(){
      themeId = t.id;
      applyTheme(t.id);
      box.querySelectorAll('.theme-chip').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      save();
    });
    box.appendChild(el);
  });
  $('overlay').classList.add('open');
}
$('gear').addEventListener('click', openSettings);
$('close-settings').addEventListener('click', () => $('overlay').classList.remove('open'));
$('overlay').addEventListener('click', e => {
  if (e.target === $('overlay')) $('overlay').classList.remove('open');
});

function renderDaily(){
  const btn = $('daily-btn'), info = $('daily-info');
  if (!btn || !info) return;
  if (daily.can){
    btn.disabled = false;
    btn.textContent = '+' + fmt(daily.bonus);
    info.textContent = 'Серия: ' + daily.streak + ' дн. · Готово';
  } else {
    btn.disabled = true;
    btn.textContent = fmtTime(daily.seconds_left);
    info.textContent = 'Серия: ' + daily.streak + ' дн.';
  }
}

$('daily-btn').addEventListener('click', function(){
  const body = new URLSearchParams({ name: STATE.name });
  fetch('/daily', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body})
    .then(r => r.json()).then(d => {
      if (d.ok){
        score = d.score;
        totalEarned = d.total_earned;
        daily.can = d.can; daily.seconds_left = d.seconds_left;
        daily.streak = d.streak; daily.bonus = d.next_bonus || daily.bonus;
        checkLevelUp();
        spawnFloat('+' + fmt(d.bonus), window.innerWidth/2, 180);
      } else {
        daily.can = d.can; daily.seconds_left = d.seconds_left;
        daily.streak = d.streak; daily.bonus = d.next_bonus || 0;
      }
      renderStats(); renderDaily(); renderList();
    });
});

setInterval(function(){
  if (!daily.can && daily.seconds_left > 0){
    daily.seconds_left -= 1;
    if (daily.seconds_left <= 0){
      const body = new URLSearchParams({ name: STATE.name });
      fetch('/daily', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body})
        .then(r => r.json()).then(d => {
          daily.can = d.can; daily.seconds_left = d.seconds_left;
          daily.streak = d.streak; daily.bonus = d.next_bonus || daily.bonus;
          renderDaily();
        });
    } else renderDaily();
  }
}, 1000);

function doRebirth(){
  if (totalEarned < rebirthThreshold) return;
  if (!confirm('Перерождение сбросит весь текущий прогресс. Продолжить?')) return;
  fetch('/rebirth', {method:'POST'})
    .then(r => r.json()).then(d => {
      if (d.ok){
        rebirths = d.rebirths;
        rebirthBonus = d.rebirthBonus;
        rebirthThreshold = d.rebirthThreshold;
        score = 0; power = 1; cps = 0; lvl = 1; next = 100;
        totalEarned = 0;
        counts = {}; SHOP.forEach(i => counts[i.id] = 0);
        ownedMap = {}; COLLECTION.forEach(i => ownedMap[i.id] = 0);
        clickMult = 0; cpsMult = 0;
        daily.can = true; daily.seconds_left = 0;
        daily.streak = 0;
        renderStats(); renderList(); renderDaily(); renderRebirth();
        spawnFloat('💎 Перерождение!', window.innerWidth/2, 200);
      } else {
        alert('Недостаточно прогресса');
      }
    });
}

function save(){
  const payload = {score, power, cps, lvl, next, clickMult, cpsMult,
                   total_earned: totalEarned, theme: themeId};
  SHOP.forEach(i => {
    payload['c_'+i.id] = priceAfter(i.base, i.mult, counts[i.id]||0, 1);
    payload['n_'+i.id] = counts[i.id]||0;
  });
  COLLECTION.forEach(i => { payload['o_'+i.id] = ownedMap[i.id] ? 1 : 0; });
  const body = new URLSearchParams({
    name: STATE.name, payload: JSON.stringify(payload),
    session_id: STATE.session_id || ""
  });
  fetch('/save', {method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'}, body}).catch(()=>{});
}

let tickCounter = 0;
setInterval(function(){
  if (cps > 0){
    const gain = cps / 30;
    score += gain;
    totalEarned += gain;
    checkLevelUp();
    renderStats();
    tickCounter++;
    if (tickCounter >= 150){ save(); tickCounter = 0; }
  }
}, 1000 / 30);

if (STATE.offline_gain && STATE.offline_gain > 0){
  const t = document.createElement('div');
  t.className = 'offline-toast';
  t.innerHTML = 'Пока тебя не было: <b>+' + fmt(STATE.offline_gain) + '</b>';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

applyTheme(themeId);
renderTabs(); renderStats(); renderDaily(); renderList();
</script>
</body></html>
