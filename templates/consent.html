<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Разрешение · Down ID</title>
<style>
:root{
  --text:#f4f7fc;
  --muted:#8a93a6;
  --accent:#5ff0ff;
  --accent2:#8ab0ff;
  --purple:#b57bff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#000;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(600px 400px at 20% 20%, rgba(95,240,255,.10), transparent 60%),
    radial-gradient(600px 400px at 80% 80%, rgba(181,123,255,.10), transparent 60%);
  pointer-events:none;
}
.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:440px;
  background:rgba(15,18,25,.7);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:32px 28px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp .6s ease-out forwards;
}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

.service-icon{
  width:60px;
  height:60px;
  margin:0 auto 16px;
  border-radius:16px;
  background:linear-gradient(135deg, var(--accent), var(--accent2), var(--purple));
  display:grid;
  place-items:center;
  font-size:30px;
  color:#000;
  box-shadow:0 0 40px rgba(95,240,255,.4);
}
.card h1{
  font-size:22px;
  font-weight:800;
  text-align:center;
  letter-spacing:-.3px;
  margin-bottom:6px;
}
.card .sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:24px;
}
.card .sub b{color:var(--text);font-weight:600}

.trust-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(74, 222, 128, 0.08);
  border: 1px solid rgba(74, 222, 128, 0.2);
  color: #4ade80;
  font-size: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 24px;
  font-weight: 600;
}

.scope{
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.06);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:20px;
}
.scope-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--muted);
  margin-bottom:12px;
}
.scope-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  font-size:13px;
  color:var(--text);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.scope-row:last-child{border-bottom:none}
.scope-row .ico{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.scope-row .txt b{display:block;font-weight:600; margin-bottom: 2px;}
.scope-row .txt span{font-size:11px;color:var(--muted); line-height: 1.4;}

.actions{
  display:flex;
  gap:10px;
}
.actions form{flex:1}
.actions button{
  width:100%;
  padding:13px 16px;
  border-radius:11px;
  border:none;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  transition:transform .15s ease, box-shadow .2s ease, background .15s ease;
}
.btn-deny{
  background:rgba(255,255,255,.06);
  color:var(--muted);
  border:1px solid rgba(255,255,255,.1) !important;
}
.btn-deny:hover{background:rgba(255,255,255,.1);color:var(--text)}
.btn-allow{
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  color:#000;
  box-shadow:0 8px 24px rgba(95,240,255,.35);
}
.btn-allow:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 32px rgba(95,240,255,.5);
}

.foot{
  text-align:center;
  margin-top:18px;
  font-size:11px;
  color:var(--muted);
}
</style></head><body>
<div class="card">
  <div class="service-icon">__SERVICE_ICON__</div>
  <h1>__SERVICE_TITLE__</h1>
  <div class="sub">Хочет получить доступ к твоему <b>Down ID</b> (__NAME__)</div>

  <div class="trust-badge">
    <span>🛡</span>
    <span>Доверенный сервис imdown.pro</span>
  </div>

  <div class="scope">
    <div class="scope-title">Что получит сервис</div>
    __SCOPES__
  </div>

  <!-- ОБЕРНУЛИ КНОПКИ В DIV С КЛАССОМ ACTIONS -->
  <div class="actions">
    <form method="post" action="/consent_deny">
      <input type="hidden" name="service" value="__SERVICE_KEY__">
      <button type="submit" class="btn-deny">Отклонить</button>
    </form>

    <form method="post" action="/consent_allow">
      <input type="hidden" name="service" value="__SERVICE_KEY__">
      <button type="submit" class="btn-allow">Разрешить</button>
    </form>
  </div>

  <div class="foot">
    Down ID защищает твои данные. Мы не передаём их третьим лицам.
  </div>
</div>
</body></html>
